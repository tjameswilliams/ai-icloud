[package]
name = "ai-icloud"
version = "0.1.1"
edition = "2024"
description = "Local-first iCloud Drive document RAG index and MCP server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tjameswilliams/ai-icloud"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
fastembed = "5.17"
globset = "0.4"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tiny_http = "0.12"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", features = ["json"] }
walkdir = "2"
whisper-rs = { version = "0.16.0", features = ["metal"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
